.hm { display: grid; grid-template-columns: minmax(150px, 210px) repeat(5, 44px) minmax(110px, 1fr) 110px; gap: 6px; align-items: center; min-width: 640px; }
.hm .hd { display: grid; place-items: center; color: var(--accent); }
.hm .hd .ic { width: 20px; height: 20px; }
.hm .nm { font-size: 13px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.hm .nm span { display: block; font-size: 11px; color: var(--ink-3); }

.hm .cell i { position: absolute; inset: 0; background: var(--bar); }
.hm .stop { grid-column: span 5; display: flex; gap: 8px; align-items: center; font-size: 12px; color: var(--ink-3); background: var(--surface-2); border-radius: 8px; height: 36px; padding: 0 10px; }
.hm .stop .ic { width: 18px; height: 18px; color: var(--accent); }
.hm .tot { position: relative; height: 14px; background: var(--surface-2); border-radius: 0 4px 4px 0; }
.hm .tot div { position: absolute; left: 0; top: 0; bottom: 0; background: var(--bar); border-radius: 0 4px 4px 0; }
.hm .tot .tick { position: absolute; top: -4px; bottom: -4px; border-left: 1px dashed var(--ink-3); }
.hm .bd { font-size: 12px; font-weight: 700; display: flex; gap: 4px; align-items: center; justify-content: flex-end; }
.hm .bd .ic { width: 16px; height: 16px; }
.bd.go { color: var(--good); } .bd.maybe { color: var(--warn); } .bd.no { color: var(--ink-3); }
.itiles .tile { display: flex; gap: 12px; align-items: center; }
.flow { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; }
.flow .fs { flex: 1 1 120px; display: flex; flex-direction: column; align-items: center; gap: 4px; text-align: center; }
.flow .fs b { font-size: 22px; font-variant-numeric: tabular-nums; }
.flow .fs span { font-size: 12px; color: var(--ink-3); }
.flow .ar { display: flex; flex-direction: column; align-items: center; color: var(--ink-3); font-size: 12px; font-weight: 700; }
.flow .ar .ic { width: 18px; height: 18px; }
#scatter svg { width: 100%; height: auto; display: block; }
#scatter text { fill: var(--ink-3); font-size: 11px; }
#scatter .q { fill: var(--ink-3); font-size: 11px; font-weight: 700; }
#scatter .lbl { fill: var(--ink); font-size: 11px; }
#scatter .pt { fill: var(--bar); fill-opacity: .75; stroke: var(--surface); stroke-width: 2; }
#scatter .pt:hover { fill-opacity: 1; }
#scatter .gl { stroke: var(--line); }
#scatter .md { stroke: var(--ink-3); stroke-dasharray: 3 3; }
.cwall { display: grid; gap: 12px; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); }
.cw { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 14px; position: relative; }
.cw .top { display: flex; gap: 10px; align-items: center; }
.cw .av { width: 40px; height: 40px; border-radius: 50%; background: var(--accent); color: #fff; display: grid; place-items: center; font-weight: 800; flex: none; }
.cw .who { min-width: 0; }
.cw .who b { display: block; font-size: 13px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.cw .who span { font-size: 11px; color: var(--ink-3); display: flex; gap: 6px; align-items: center; }
.dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; }
.dot.active { background: var(--good); } .dot.paused { background: var(--warn); } .dot.briefed, .dot.ended { background: var(--ink-3); }
.cw .mb { display: grid; grid-template-columns: 18px 1fr 48px; gap: 6px; align-items: center; font-size: 12px; margin-top: 8px; }
.cw .mb .ic { width: 16px; height: 16px; color: var(--ink-3); }
.cw .mb .tr { height: 8px; background: var(--surface-2); border-radius: 0 4px 4px 0; }
.cw .mb .tr div { height: 8px; background: var(--bar); border-radius: 0 4px 4px 0; }
.cw .mb b { text-align: right; font-variant-numeric: tabular-nums; }
.cw .cost { display: flex; gap: 6px; align-items: center; font-size: 12px; color: var(--ink-2); margin-top: 10px; border-top: 1px solid var(--line); padding-top: 8px; }
.cw .cost .ic { width: 16px; height: 16px; color: var(--ink-3); }
.cw .al { position: absolute; top: 10px; right: 10px; color: var(--warn); cursor: help; }
.cw .al .ic { width: 20px; height: 20px; }
details summary { cursor: pointer; font-weight: 600; color: var(--accent); margin: 8px 0; }
.steps3 { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; margin-top: 8px; }
.steps3 .st { flex: 1 1 180px; display: flex; gap: 12px; align-items: center; background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 14px; }
.steps3 .st b { display: block; font-size: 16px; }
.steps3 .st span { font-size: 12px; color: var(--ink-3); }
.steps3 .ar { color: var(--ink-3); }
.sh { display: flex; gap: 10px; align-items: center; font-weight: 700; font-size: 16px; margin-bottom: 10px; }
.sh .n { width: 26px; height: 26px; border-radius: 50%; background: var(--accent); color: #fff; display: grid; place-items: center; font-size: 13px; }
.tr2 { padding: 8px 0; border-bottom: 1px solid var(--line); font-size: 13px; }
.tr2 .row1 { display: flex; justify-content: space-between; gap: 8px; align-items: center; }
.tr2 .bar2 { height: 8px; background: var(--surface-2); border-radius: 0 4px 4px 0; margin-top: 6px; }
.tr2 .bar2 div { height: 8px; background: var(--bar); border-radius: 0 4px 4px 0; }
.tc { border: 2px solid var(--accent); border-radius: 14px; padding: 12px; position: relative; }
.tc .mix { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; font-size: 12px; font-weight: 700; }
.tc .mix .chip { font-size: 12px; }
.tc .ttl { font-size: 16px; font-weight: 800; margin: 10px 0 6px; }
.tc .meta { display: flex; flex-direction: column; gap: 6px; font-size: 13px; color: var(--ink-2); }
.tc .meta div { display: flex; gap: 8px; align-items: center; }
.tc .meta .ic { width: 16px; height: 16px; color: var(--ink-3); }
.tc .ok { margin-top: 10px; display: inline-flex; gap: 6px; align-items: center; background: var(--good-soft); color: var(--good); border-radius: 999px; padding: 3px 10px; font-size: 12px; font-weight: 700; }
.tc .ok .ic { width: 16px; height: 16px; }
.mk { display: flex; flex-direction: column; gap: 10px; }
.mk div { display: flex; gap: 10px; align-items: center; font-size: 14px; }
.mk .icb { width: 38px; height: 38px; border-radius: 12px; }
.mk .icb .ic { width: 20px; height: 20px; }
.mk .pass .icb { background: var(--good-soft); color: var(--good); }
.dots { display: grid; grid-template-columns: 60px repeat(5, 1fr); gap: 6px; margin-top: 12px; align-items: center; }
.dots .dh, .dots .wk { font-size: 12px; color: var(--ink-3); font-weight: 600; text-align: center; }
.dots .wk { text-align: left; }
.dots .sq { height: 44px; border-radius: 10px; color: #fff; display: flex; justify-content: space-between; align-items: flex-end; padding: 5px 7px; font-size: 11px; font-weight: 800; cursor: default; }
.dots .sq .ic { width: 15px; height: 15px; }
@media (max-width: 700px) { .fraud .fr { grid-template-columns: 76px 1fr 36px; font-size: 12px; } .fraud .pp .ic { width: 13px; height: 13px; } .rc { grid-template-columns: 110px 1fr; } .dots { grid-template-columns: 44px repeat(5, 1fr); } .dots .sq { font-size: 9px; padding: 4px; } }
.samples { display: flex; flex-direction: column; gap: 18px; }
.sph { display: flex; gap: 12px; align-items: center; margin-bottom: 10px; }
.sph b { display: block; font-size: 15px; }
.sph span { font-size: 12px; color: var(--ink-3); }
.sstrip { display: grid; grid-template-columns: repeat(6, minmax(120px, 1fr)); gap: 10px; overflow-x: auto; padding-bottom: 4px; }
.sstrip.oa { grid-template-columns: repeat(4, minmax(130px, 210px)); }
.sstrip figure { margin: 0; position: relative; cursor: zoom-in; }
.sstrip img { width: 100%; display: block; border-radius: 10px; border: 1px solid var(--line); }
.sstrip figcaption { position: absolute; top: 6px; left: 6px; background: var(--accent); color: #fff; font-size: 11px; font-weight: 800; border-radius: 999px; padding: 1px 8px; }
#lb { position: fixed; inset: 0; background: rgba(0,0,0,.82); display: none; align-items: center; justify-content: center; z-index: 20; cursor: zoom-out; padding: 20px; }
#lb.on { display: flex; }
#lb img { max-width: 100%; max-height: 100%; border-radius: 12px; }
.gpath { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 22px; margin-top: 8px; }
.gp { background: #fff; color: #1a1a1a; border-radius: 16px; padding: 12px; display: flex; flex-direction: column; gap: 8px; position: relative; box-shadow: 0 6px 18px rgba(0,0,0,.12); }
.gp.off { background: #fbefee; }
.gp + .gp::before { content: &quot;→&quot;; position: absolute; left: -19px; top: 50%; transform: translateY(-50%); color: #fff; font-weight: 800; font-size: 18px; }
.gp .k { color: #CB2D2E; font-weight: 700; font-size: 11px; text-transform: uppercase; letter-spacing: .05em; }
.gp .t { font-size: 13px; font-weight: 600; line-height: 1.35; }
.gp .vis { height: 112px; border-radius: 10px; overflow: hidden; display: grid; place-items: center; background: #f6eeee; position: relative; }
.gp .vis img { width: 100%; height: 100%; object-fit: cover; object-position: top; }
.gp .thumbs { display: grid; grid-template-columns: repeat(3, 1fr); gap: 4px; width: 100%; height: 100%; padding: 6px; }
.gp .vis .thumbs img { width: 100%; height: 100%; min-width: 0; border-radius: 6px; object-fit: cover; object-position: top; }
.gp .vis .ic { width: 52px; height: 52px; }
.gp .bubble { background: #fff; border: 2px solid #CB2D2E; border-radius: 16px; padding: 8px 10px; font-size: 12px; font-weight: 700; color: #CB2D2E; margin: 0 8px; text-align: center; }
.gp .offer { display: flex; gap: 8px; align-items: center; padding: 8px; width: 100%; height: 100%; background: #fff; }
.gp .offer img { width: 64px; height: auto; object-fit: contain; }
.gp .offer .doc { flex: 1; display: flex; flex-direction: column; gap: 5px; }
.gp .offer .doc i { display: block; height: 5px; border-radius: 3px; background: #e5dcdc; }
.gp .offer .doc b { font-size: 10px; background: #FAE94E; color: #1a1a1a; border-radius: 4px; padding: 2px 4px; }
.gp .ic { width: 44px; height: 44px; color: #CB2D2E; }
@media (max-width: 900px) { .gpath { grid-template-columns: repeat(2, minmax(0, 1fr)); } .gp + .gp::before { display: none; } }
.fraud .fr.dim { opacity: .45; }
.tiers { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px; margin: 4px 0 14px; }
.tb { border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; display: flex; flex-direction: column; gap: 2px; }
.tb.dim { opacity: .6; }
.tb .pp2 { display: flex; gap: 1px; color: var(--accent); height: 22px; }
.tb .pp2 .ic { width: 18px; height: 18px; }
.tb b { font-size: 18px; }
.tb span { font-size: 12px; color: var(--ink-3); }
@media (max-width: 700px) { .tiers { grid-template-columns: repeat(2, minmax(0, 1fr)); } }

&lt;header class=&quot;hero&quot; id=&quot;top&quot;&gt;&lt;div class=&quot;in&quot;&gt;
  &lt;p class=&quot;eyebrow&quot;&gt;Medibank · China social media · Content portfolio&lt;/p&gt;
  &lt;h1&gt;Medibank&#x27;s content portfolio for Chinese social media&lt;/h1&gt;
  &lt;p class=&quot;sub&quot;&gt;One agent that runs Medibank&#x27;s content for Chinese international students: it &lt;b&gt;finds the right creators&lt;/b&gt;, &lt;b&gt;tracks them on a live dashboard&lt;/b&gt;, and &lt;b&gt;plans and produces every post&lt;/b&gt;, within China&#x27;s advertising and insurance rules.&lt;/p&gt;
  &lt;div class=&quot;platforms&quot; id=&quot;platforms&quot;&gt;&lt;/div&gt;
  &lt;div class=&quot;features&quot;&gt;
    &lt;a class=&quot;feature&quot; href=&quot;#find&quot;&gt;&lt;span class=&quot;num&quot;&gt;1&lt;/span&gt;&lt;span class=&quot;ft&quot;&gt;Find the right creators&lt;/span&gt;&lt;span class=&quot;fbig&quot; id=&quot;f1big&quot;&gt;&lt;/span&gt;&lt;span class=&quot;fs&quot; id=&quot;f1sub&quot;&gt;&lt;/span&gt;&lt;span class=&quot;mini&quot; id=&quot;f1mini&quot;&gt;&lt;/span&gt;&lt;/a&gt;

    &lt;a class=&quot;feature&quot; href=&quot;#plan&quot;&gt;&lt;span class=&quot;num&quot;&gt;3&lt;/span&gt;&lt;span class=&quot;ft&quot;&gt;Plan and create posts&lt;/span&gt;&lt;span class=&quot;fbig&quot; id=&quot;f3big&quot;&gt;&lt;/span&gt;&lt;span class=&quot;fs&quot; id=&quot;f3sub&quot;&gt;&lt;/span&gt;&lt;span class=&quot;mini&quot; id=&quot;f3mini&quot;&gt;&lt;/span&gt;&lt;/a&gt;
  &lt;/div&gt;
  &lt;div class=&quot;goal&quot;&gt;
    &lt;div class=&quot;gl&quot;&gt;The end goal&lt;/div&gt;

&lt;main&gt;
  &lt;section id=&quot;find&quot;&gt;
    &lt;p class=&quot;eyebrow&quot;&gt;Feature 1&lt;/p&gt;
    &lt;h2&gt;Find the right creators&lt;/h2&gt;
    &lt;p class=&quot;sub&quot;&gt;The agent logs in to Xiaohongshu, browses like a person, checks every profile against the skill, then scores and files it. Tested end to end: 10 lifestyle keywords, about 200 posts browsed, 28 profiles checked, 8 shortlisted. View only: no likes, follows or messages.&lt;/p&gt;
    &lt;div class=&quot;persona&quot; id=&quot;persona&quot;&gt;&lt;/div&gt;
    &lt;div class=&quot;grid g2 mt&quot;&gt;
      &lt;div class=&quot;card&quot;&gt;
        &lt;h3&gt;What we score&lt;/h3&gt;
        &lt;p class=&quot;note top&quot;&gt;Five checks, 1–5 each; total × 4 = score out of 100. ≥ 88 and under 2k followers → Shortlist&lt;/p&gt;
        &lt;div class=&quot;crit&quot; id=&quot;crit&quot;&gt;&lt;/div&gt;
      &lt;/div&gt;
      &lt;div class=&quot;card&quot;&gt;
        &lt;h3&gt;Why not follower count?&lt;/h3&gt;
        &lt;p class=&quot;note top&quot;&gt;Correlation with purchase intention &lt;span class=&quot;idtag&quot;&gt;E-14&lt;/span&gt; &lt;span class=&quot;idtag&quot;&gt;E-15&lt;/span&gt;&lt;/p&gt;
        &lt;div id=&quot;rchart&quot; role=&quot;img&quot; aria-label=&quot;Correlation of each trait with purchase intention; follower count is near zero&quot;&gt;&lt;/div&gt;
        &lt;div id=&quot;fraud&quot;&gt;&lt;/div&gt;
      &lt;/div&gt;
    &lt;/div&gt;
    &lt;div class=&quot;card mt&quot;&gt;
      &lt;h3&gt;Screen out&lt;/h3&gt;
      &lt;div class=&quot;stops&quot; id=&quot;stops&quot;&gt;&lt;/div&gt;
    &lt;/div&gt;
    &lt;div class=&quot;demo&quot; data-icon=&quot;check&quot;&gt;&lt;b&gt;Real scan results.&lt;/b&gt; The 28 Xiaohongshu profiles our agent checked. Creators with Chinese nicknames are shown by library ID; full records are in the creator library.&lt;/div&gt;
    &lt;div class=&quot;card&quot;&gt;
      &lt;h3&gt;Creator library&lt;/h3&gt;
      &lt;div class=&quot;tiers&quot; id=&quot;tiers&quot;&gt;&lt;/div&gt;
      &lt;button class=&quot;more&quot; id=&quot;heatbtn&quot; type=&quot;button&quot; aria-expanded=&quot;false&quot; aria-controls=&quot;heatbox&quot;&gt;Show all creators and scores&lt;/button&gt;
      &lt;div id=&quot;heatbox&quot; hidden&gt;
        &lt;p class=&quot;note top&quot;&gt;Darker square = higher score on that check (1–5). Hover any square.&lt;/p&gt;
        &lt;div class=&quot;scroll&quot;&gt;&lt;div class=&quot;hm&quot; id=&quot;heat&quot;&gt;&lt;/div&gt;&lt;/div&gt;
      &lt;/div&gt;
    &lt;/div&gt;
  &lt;/section&gt;

  &lt;section id=&quot;manage&quot;&gt;
    &lt;p class=&quot;eyebrow&quot;&gt;Feature 2&lt;/p&gt;
    &lt;h2&gt;Creator dashboard&lt;/h2&gt;
    &lt;p class=&quot;sub&quot;&gt;See how every creator we work with is performing, in one place: posts, likes, comments, saves and OSHC inquiries, plus the follow-ups the agent flags.&lt;/p&gt;
    &lt;div class=&quot;demo&quot; data-icon=&quot;info&quot;&gt;&lt;b&gt;Demo data.&lt;/b&gt; Every number here is made up to show how the dashboard works. Real results appear once the team adds creator exports.&lt;/div&gt;
    &lt;div class=&quot;tiles itiles&quot; id=&quot;ctiles&quot;&gt;&lt;/div&gt;

      &lt;h3&gt;From view to inquiry&lt;/h3&gt;
      &lt;div class=&quot;flow&quot; id=&quot;cflow&quot;&gt;&lt;/div&gt;
    &lt;/div&gt;

      &lt;div class=&quot;card&quot;&gt;

        &lt;p class=&quot;note top&quot;&gt;Higher = more inquiries · further left = cheaper per inquiry · bubble = followers&lt;/p&gt;

      &lt;/div&gt;

  &lt;section id=&quot;plan&quot;&gt;
    &lt;p class=&quot;eyebrow&quot;&gt;Feature 3&lt;/p&gt;
    &lt;h2&gt;Plan and create posts&lt;/h2&gt;
    &lt;p class=&quot;sub&quot;&gt;From a trending topic to a finished post in three steps.&lt;/p&gt;
    &lt;div class=&quot;demo&quot; data-icon=&quot;info&quot;&gt;&lt;b&gt;Demo data.&lt;/b&gt; Trends, topic and calendar are examples to show how it works.&lt;/div&gt;
    &lt;div class=&quot;steps3&quot; id=&quot;steps3&quot;&gt;&lt;/div&gt;
    &lt;div class=&quot;grid g3 mt&quot;&gt;
      &lt;div class=&quot;card&quot;&gt;&lt;div class=&quot;sh&quot; id=&quot;sh1&quot;&gt;&lt;/div&gt;&lt;div id=&quot;radar&quot;&gt;&lt;/div&gt;&lt;/div&gt;
      &lt;div class=&quot;card&quot;&gt;&lt;div class=&quot;sh&quot; id=&quot;sh2&quot;&gt;&lt;/div&gt;&lt;div id=&quot;topic&quot;&gt;&lt;/div&gt;&lt;/div&gt;
      &lt;div class=&quot;card&quot;&gt;&lt;div class=&quot;sh&quot; id=&quot;sh3&quot;&gt;&lt;/div&gt;&lt;div id=&quot;make&quot;&gt;&lt;/div&gt;&lt;/div&gt;
    &lt;/div&gt;
    &lt;div class=&quot;card mt&quot;&gt;
      &lt;h3&gt;Sample posts&lt;/h3&gt;
      &lt;p class=&quot;note top&quot;&gt;Real drafts made for this campaign. Tap any image to see it full size.&lt;/p&gt;

&lt;div class=&quot;wrap&quot;&gt;
&lt;header&gt;
  &lt;span class=&quot;tag&quot;&gt;TESTED PROCESS&lt;/span&gt;
  &lt;h1&gt;How the agent &lt;mark&gt;finds creators&lt;/mark&gt;&lt;/h1&gt;
  &lt;p class=&quot;sub&quot;&gt;Goal: find small Chinese creators who share student life or everyday life in Australia (international students or long-term residents). All 8 steps below have been run end to end. The agent browses slowly and only views: no likes, follows, comments or DMs.&lt;/p&gt;
  &lt;div class=&quot;legend&quot;&gt;&lt;span class=&quot;pill p-ok&quot;&gt;Agent does it&lt;/span&gt;&lt;span class=&quot;pill p-warn&quot;&gt;Possible, but estimated or slow&lt;/span&gt;&lt;span class=&quot;pill p-bad&quot;&gt;Platform doesn&#x27;t show it; rule-based&lt;/span&gt;&lt;span class=&quot;pill p-who&quot;&gt;Needs a person&lt;/span&gt;&lt;/div&gt;
&lt;/header&gt;

&lt;section class=&quot;logic&quot;&gt;
  &lt;h2&gt;The search logic&lt;/h2&gt;
  &lt;p class=&quot;sub&quot; style=&quot;margin:0&quot;&gt;Each stage narrows the pool. A creator moves on only if they pass the gate on the right.&lt;/p&gt;
  &lt;div class=&quot;funnel&quot;&gt;
    &lt;div class=&quot;stage&quot;&gt;&lt;div class=&quot;bar&quot;&gt;Keywords&lt;small&gt;region + audience + scene&lt;/small&gt;&lt;/div&gt;&lt;div class=&quot;gate&quot;&gt;&lt;span class=&quot;keep&quot;&gt;✓ Lifestyle words: 悉尼留学日常, 墨尔本 + 租房日常&lt;/span&gt;&lt;span class=&quot;drop&quot;&gt;✗ Insurance or doctor words: they surface agencies and clinics, not students&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;
    &lt;div class=&quot;stage&quot;&gt;&lt;div class=&quot;bar&quot;&gt;Posts&lt;small&gt;~20 per keyword&lt;/small&gt;&lt;/div&gt;&lt;div class=&quot;gate&quot;&gt;&lt;span class=&quot;keep&quot;&gt;✓ Posted minutes to hours ago, under 30 likes: small, active creators&lt;/span&gt;&lt;span class=&quot;drop&quot;&gt;✗ Viral posts at the top: big accounts&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;
    &lt;div class=&quot;stage&quot;&gt;&lt;div class=&quot;bar&quot;&gt;Profiles&lt;small&gt;open 3–5 per keyword&lt;/small&gt;&lt;/div&gt;&lt;div class=&quot;gate&quot;&gt;&lt;span class=&quot;keep&quot;&gt;✓ IP location Australia, student or long-term resident, under 2k followers&lt;/span&gt;&lt;span class=&quot;drop&quot;&gt;✗ Hidden IP, overseas, agency, clinic or merchant&lt;/span&gt;&lt;span&gt;↻ A good fit? Snowball to similar accounts and active commenters&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;
    &lt;div class=&quot;stage&quot;&gt;&lt;div class=&quot;bar&quot;&gt;Screened&lt;small&gt;real people only&lt;/small&gt;&lt;/div&gt;&lt;div class=&quot;gate&quot;&gt;&lt;span class=&quot;keep&quot;&gt;✓ Real daily life in their own voice, posted in the last 1–2 weeks&lt;/span&gt;&lt;span class=&quot;drop&quot;&gt;✗ Account farms, fake followers, soft-ad accounts, sells insurance or agency services&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;
    &lt;div class=&quot;stage&quot;&gt;&lt;div class=&quot;bar&quot;&gt;Library&lt;small&gt;scored /100&lt;/small&gt;&lt;/div&gt;&lt;div class=&quot;gate&quot;&gt;&lt;span&gt;Fit · Size · Activity · Authenticity · Content (1–5 each, ×4)&lt;/span&gt;&lt;span class=&quot;keep&quot;&gt;≥ 88 and under 2k → Shortlist&lt;/span&gt;&lt;span&gt;72–87 → Watch · red flag → Exclude · 2k+ → Reference&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;
  &lt;/div&gt;
&lt;/section&gt;

&lt;ol class=&quot;steps&quot;&gt;
  &lt;li class=&quot;step&quot;&gt;&lt;div class=&quot;num&quot;&gt;📱&lt;small&gt;1&lt;/small&gt;&lt;/div&gt;&lt;div class=&quot;body&quot;&gt;
    &lt;div class=&quot;hd&quot;&gt;&lt;b&gt;Log in by QR code&lt;/b&gt;&lt;span class=&quot;pill p-who&quot;&gt;Needs a person&lt;/span&gt;&lt;/div&gt;
    &lt;p&gt;Search doesn&#x27;t work without logging in. A team member scans the QR code with the phone app. The agent never handles passwords.&lt;/p&gt;
    &lt;div class=&quot;tip&quot;&gt;Use a dedicated team account so browsing doesn&#x27;t change a personal account&#x27;s feed or follow list.&lt;/div&gt;
  &lt;/div&gt;&lt;/li&gt;

  &lt;li class=&quot;step&quot;&gt;&lt;div class=&quot;num&quot;&gt;🔍&lt;small&gt;2&lt;/small&gt;&lt;/div&gt;&lt;div class=&quot;body&quot;&gt;
    &lt;div class=&quot;hd&quot;&gt;&lt;b&gt;Search lifestyle keywords&lt;/b&gt;&lt;span class=&quot;pill p-ok&quot;&gt;Agent&lt;/span&gt;&lt;/div&gt;
    &lt;p&gt;For example: 澳洲留学生活 (study life in Australia), 悉尼留学日常 (Sydney student daily life), 墨尔本留学 (studying in Melbourne), 澳洲华人日常 (Chinese daily life in Australia), 悉尼生活日常 (Sydney daily life), 澳洲生活分享 (life in Australia).&lt;/p&gt;
    &lt;div class=&quot;tip&quot;&gt;Formula: region + audience + scene, e.g. 悉尼 + 早八 (Sydney + 8am class), 墨尔本 + 租房日常 (Melbourne + renting). Don&#x27;t search insurance or doctor keywords. We want lifestyle creators; insurance belongs in the collaboration brief.&lt;/div&gt;
  &lt;/div&gt;&lt;/li&gt;

  &lt;li class=&quot;step&quot;&gt;&lt;div class=&quot;num&quot;&gt;🎯&lt;small&gt;3&lt;/small&gt;&lt;/div&gt;&lt;div class=&quot;body&quot;&gt;
    &lt;div class=&quot;hd&quot;&gt;&lt;b&gt;Pick posts by small creators&lt;/b&gt;&lt;span class=&quot;pill p-ok&quot;&gt;Agent&lt;/span&gt;&lt;/div&gt;
    &lt;p&gt;Default ranking puts big accounts first. Scroll down and open posts that are only hours old with fewer than 30 likes, then go to the author&#x27;s profile.&lt;/p&gt;
    &lt;div class=&quot;tip&quot;&gt;This gives the highest hit rate for small creators. When a creator fits, snowball: open the similar accounts suggested on their profile and active commenters, one at a time by hand. No bulk-export or bulk-email extensions.&lt;/div&gt;
  &lt;/div&gt;&lt;/li&gt;

  &lt;li class=&quot;step&quot;&gt;&lt;div class=&quot;num&quot;&gt;👤&lt;small&gt;4&lt;/small&gt;&lt;/div&gt;&lt;div class=&quot;body&quot;&gt;
    &lt;div class=&quot;hd&quot;&gt;&lt;b&gt;Check the profile: followers, IP location, bio&lt;/b&gt;&lt;span class=&quot;pill p-ok&quot;&gt;Agent&lt;/span&gt;&lt;/div&gt;
    &lt;p&gt;Followers, likes and IP location show on the profile (almost every profile shows the IP). The bio shows identity: school, or long-term signals such as years in Australia, owning a home, or permanent residency.&lt;/p&gt;
    &lt;div class=&quot;tiers&quot;&gt;&lt;span class=&quot;tier hi&quot;&gt;&amp;lt;500&lt;/span&gt;&lt;span class=&quot;tier hi&quot;&gt;500–1k&lt;/span&gt;&lt;span class=&quot;tier hi&quot;&gt;1k–2k&lt;/span&gt;&lt;span class=&quot;tier&quot;&gt;2k+&lt;/span&gt;&lt;/div&gt;
  &lt;/div&gt;&lt;/li&gt;

  &lt;li class=&quot;step&quot;&gt;&lt;div class=&quot;num&quot;&gt;🗓️&lt;small&gt;5&lt;/small&gt;&lt;/div&gt;&lt;div class=&quot;body&quot;&gt;
    &lt;div class=&quot;hd&quot;&gt;&lt;b&gt;Check if they&#x27;re active&lt;/b&gt;&lt;span class=&quot;pill p-warn&quot;&gt;Estimated&lt;/span&gt;&lt;/div&gt;
    &lt;p&gt;Profiles don&#x27;t show post dates, so posting frequency is estimated from the latest few posts.&lt;/p&gt;
  &lt;/div&gt;&lt;/li&gt;

  &lt;li class=&quot;step&quot;&gt;&lt;div class=&quot;num&quot;&gt;💬&lt;small&gt;6&lt;/small&gt;&lt;/div&gt;&lt;div class=&quot;body&quot;&gt;
    &lt;div class=&quot;hd&quot;&gt;&lt;b&gt;Check if they reply to comments&lt;/b&gt;&lt;span class=&quot;pill p-warn&quot;&gt;Slow&lt;/span&gt;&lt;/div&gt;
    &lt;p&gt;Each post has to be opened one by one, so this is done only for shortlisted creators.&lt;/p&gt;
  &lt;/div&gt;&lt;/li&gt;

  &lt;li class=&quot;step&quot;&gt;&lt;div class=&quot;num&quot;&gt;🚩&lt;small&gt;7&lt;/small&gt;&lt;/div&gt;&lt;div class=&quot;body&quot;&gt;
    &lt;div class=&quot;hd&quot;&gt;&lt;b&gt;Screen out ad accounts and fake followers&lt;/b&gt;&lt;span class=&quot;pill p-bad&quot;&gt;Rule-based&lt;/span&gt;&lt;/div&gt;
    &lt;p&gt;The platform doesn&#x27;t label ads. Rules used:&lt;/p&gt;
    &lt;p&gt;• New account + single-digit following + likes dozens of times the follower count → likely account farm&lt;br&gt;• Every title is &quot;🇦🇺 + question&quot; with many soft ads → likely agency (MCN) account&lt;br&gt;• Hidden IP location → downgrade&lt;br&gt;• Sells agency services, other insurance or their own business → exclude or downgrade&lt;/p&gt;
  &lt;/div&gt;&lt;/li&gt;

  &lt;li class=&quot;step&quot;&gt;&lt;div class=&quot;num&quot;&gt;📋&lt;small&gt;8&lt;/small&gt;&lt;/div&gt;&lt;div class=&quot;body&quot;&gt;
    &lt;div class=&quot;hd&quot;&gt;&lt;b&gt;Score, tier and record&lt;/b&gt;&lt;span class=&quot;pill p-ok&quot;&gt;Agent&lt;/span&gt;&lt;/div&gt;
    &lt;p&gt;Each creator is logged with platform ID, followers and tier, city, identity, content focus, activity, red flags and source keyword, then scored and grouped into Recommend / Consider / Not recommended.&lt;/p&gt;
  &lt;/div&gt;&lt;/li&gt;
&lt;/ol&gt;

&lt;section class=&quot;next&quot;&gt;
  &lt;span class=&quot;tag&quot;&gt;NEXT STEP · RECOMMENDED&lt;/span&gt;
  &lt;h2&gt;Open a 蒲公英 brand account&lt;/h2&gt;
  &lt;p&gt;蒲公英 (Pugongying) is Xiaohongshu&#x27;s official creator marketplace. Use this process to build the shortlist, then look each creator up in 蒲公英.&lt;/p&gt;
  &lt;div class=&quot;out&quot;&gt;
    &lt;div class=&quot;box go&quot;&gt;&lt;b&gt;📊 Back-end data&lt;/b&gt;&lt;ul&gt;&lt;li&gt;Audience location, age, gender&lt;/li&gt;&lt;li&gt;Reach and engagement on past notes&lt;/li&gt;&lt;li&gt;Quoted price&lt;/li&gt;&lt;/ul&gt;&lt;/div&gt;
    &lt;div class=&quot;box go&quot;&gt;&lt;b&gt;✅ The allowed route&lt;/b&gt;&lt;ul&gt;&lt;li&gt;Paid notes are booked here and carry the sponsor tag&lt;/li&gt;&lt;li&gt;Private deals are penalised by the platform&lt;/li&gt;&lt;/ul&gt;&lt;/div&gt;
    &lt;div class=&quot;box&quot;&gt;&lt;b&gt;🏢 MCN agencies&lt;/b&gt;&lt;ul&gt;&lt;li&gt;Book several creators at once&lt;/li&gt;&lt;li&gt;Still through 蒲公英, same screening&lt;/li&gt;&lt;/ul&gt;&lt;/div&gt;
  &lt;/div&gt;
&lt;/section&gt;

&lt;section&gt;
  &lt;h2&gt;Screening rules at a glance&lt;/h2&gt;
  &lt;div class=&quot;out&quot;&gt;
    &lt;div class=&quot;box go&quot;&gt;&lt;b&gt;✅ Recommend&lt;/b&gt;&lt;ul&gt;&lt;li&gt;IP location in Australia&lt;/li&gt;&lt;li&gt;Under 2k followers&lt;/li&gt;&lt;li&gt;Shares real daily life and still posting&lt;/li&gt;&lt;li&gt;Open to collaboration (a contact email is a plus)&lt;/li&gt;&lt;/ul&gt;&lt;/div&gt;
    &lt;div class=&quot;box&quot;&gt;&lt;b&gt;🤔 Consider&lt;/b&gt;&lt;ul&gt;&lt;li&gt;Posts rarely&lt;/li&gt;&lt;li&gt;Mostly questions or second-hand sales&lt;/li&gt;&lt;li&gt;Promotes their own small business on the side&lt;/li&gt;&lt;/ul&gt;&lt;/div&gt;
    &lt;div class=&quot;box no&quot;&gt;&lt;b&gt;⛔ Not recommended&lt;/b&gt;&lt;ul&gt;&lt;li&gt;Likely account farm or agency account&lt;/li&gt;&lt;li&gt;Hidden IP location&lt;/li&gt;&lt;li&gt;Over 2k followers, mainly paid store reviews&lt;/li&gt;&lt;li&gt;Sells agency services or other insurance&lt;/li&gt;&lt;/ul&gt;&lt;/div&gt;
  &lt;/div&gt;
&lt;/section&gt;

&lt;header&gt;&lt;div class=&quot;tag&quot;&gt;KNOWLEDGE BASE&lt;/div&gt;&lt;h1&gt;Creator &lt;mark&gt;Library&lt;/mark&gt;&lt;/h1&gt;
&lt;p class=&quot;sub&quot;&gt;Every creator found with the tested search process (references/creator-finding.md), sorted by platform, scored and given a status.
Xiaohongshu comes first: it is the platform Chinese students search and trust most for study-abroad life. New creators are added as rows in creators/scouted/&amp;lt;platform&amp;gt;.csv.&lt;/p&gt;&lt;/header&gt;
